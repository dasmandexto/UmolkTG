    <script>
      // Ignore HMR / module-runner WebSocket connection errors in preview environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.preventDefault();
        }
      }, true);
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
